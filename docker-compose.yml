services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: framecraft-backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./config:/app/config
      - ./vendor:/app/vendor
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - FRAMECRAFT_RETENTION_HOURS=${FRAMECRAFT_RETENTION_HOURS:-24}
      - FRAMECRAFT_RETENTION_ENABLED=${FRAMECRAFT_RETENTION_ENABLED:-1}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: framecraft-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

# 说明：
# - HyperFrames 渲染依赖 Node>=22 与 Chromium。渲染失败时任务直接失败，不生成 FFmpeg 兜底视频。
# - 后端在进程内以线程池跑 JobRunner，无需独立 worker；如需横向扩展可拆分。
